AWSTemplateFormatVersion: '2010-09-09'
Description: 'Assignment 3 demonstration stack: two buckets, original inline Lambda code, API Gateway and IAM. Reuses
  existing Lex, Elasticsearch and search dependency layer.'
Parameters:
  ResourcePrefix:
    Type: String
    Default: cc-a3-cfn
    AllowedPattern: '[a-z][a-z0-9-]{2,19}'
    Description: Unique prefix for this demonstration photo bucket. Use a different prefix for a second stack.
  ElasticsearchEndpoint:
    Type: String
    Default: https://search-photos-cdynpqfytpmnipgcgv6kl2j5im.us-east-1.es.amazonaws.com
  LexBotId:
    Type: String
    Default: N02KESP6BK
  LexAliasId:
    Type: String
    Default: W2NZ6QZCSD
  SearchDependenciesLayerArn:
    Type: String
    Description: Copy the version ARN of the existing photo-search-dependencies layer (version 1) from search-photos.
      Must be in the same Region/account.
Resources:
  IndexRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      Policies:
      - PolicyName: PhotoAlbumPermissions
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
            Resource:
              Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*
          - Effect: Allow
            Action: s3:GetObject
            Resource:
              Fn::Sub: arn:${AWS::Partition}:s3:::${ResourcePrefix}-${AWS::AccountId}-${AWS::Region}-photos/*
          - Effect: Allow
            Action: rekognition:DetectLabels
            Resource: '*'
          - Effect: Allow
            Action:
            - es:ESHttpGet
            - es:ESHttpHead
            - es:ESHttpPut
            Resource:
              Fn::Sub: arn:${AWS::Partition}:es:${AWS::Region}:${AWS::AccountId}:domain/photos/*
  SearchRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      Policies:
      - PolicyName: PhotoAlbumPermissions
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
            Resource:
              Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*
          - Effect: Allow
            Action: s3:GetObject
            Resource:
              Fn::Sub: arn:${AWS::Partition}:s3:::${ResourcePrefix}-${AWS::AccountId}-${AWS::Region}-photos/*
          - Effect: Allow
            Action:
            - es:ESHttpGet
            - es:ESHttpPost
            - es:ESHttpDelete
            Resource:
              Fn::Sub: arn:${AWS::Partition}:es:${AWS::Region}:${AWS::AccountId}:domain/photos/*
          - Effect: Allow
            Action: lex:RecognizeText
            Resource:
              Fn::Sub: arn:${AWS::Partition}:lex:${AWS::Region}:${AWS::AccountId}:bot-alias/${LexBotId}/${LexAliasId}
  IndexPhotos:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.lambda_handler
      Role:
        Fn::GetAtt:
        - IndexRole
        - Arn
      Timeout: 30
      MemorySize: 256
      Architectures:
      - x86_64
      Code:
        ZipFile: |-
          # CloudFormation code update demonstration: version 2
          import hashlib
          import json
          import os
          from urllib.error import HTTPError
          from urllib.parse import unquote_plus
          from urllib.request import Request, urlopen

          import boto3
          from botocore.auth import SigV4Auth
          from botocore.awsrequest import AWSRequest

          session = boto3.Session()
          s3 = session.client("s3")
          rekognition = session.client("rekognition")


          def es_request(method, path, body=None):
              url = os.environ["ES_ENDPOINT"].rstrip("/") + path
              data = json.dumps(body).encode("utf-8") if body is not None else None

              request = AWSRequest(
                  method=method,
                  url=url,
                  data=data,
                  headers={"Content-Type": "application/json"}
              )

              credentials = session.get_credentials().get_frozen_credentials()
              SigV4Auth(credentials, "es", os.environ["AWS_REGION"]).add_auth(request)

              signed = Request(
                  url,
                  data=data,
                  headers=dict(request.headers),
                  method=method
              )

              try:
                  with urlopen(signed, timeout=10) as response:
                      raw = response.read().decode("utf-8")
                      return response.status, json.loads(raw) if raw else {}
              except HTTPError as error:
                  raw = error.read().decode("utf-8")
                  try:
                      details = json.loads(raw) if raw else {}
                  except ValueError:
                      details = {"message": raw}
                  return error.code, details


          def ensure_index():
              status, details = es_request("HEAD", "/photos")

              if status == 200:
                  return
              if status != 404:
                  raise RuntimeError(f"Index check failed: {status} {details}")

              mapping = {
                  "settings": {
                      "number_of_shards": 1,
                      "number_of_replicas": 0
                  },
                  "mappings": {
                      "properties": {
                          "objectKey": {"type": "keyword"},
                          "bucket": {"type": "keyword"},
                          "createdTimestamp": {"type": "date"},
                          "labels": {
                              "type": "text",
                              "analyzer": "english",
                              "fields": {
                                  "raw": {"type": "keyword"}
                              }
                          }
                      }
                  }
              }

              status, details = es_request("PUT", "/photos", mapping)
              error_type = (details.get("error") or {}).get("type")

              if status not in (200, 201):
                  if error_type != "resource_already_exists_exception":
                      raise RuntimeError(
                          f"Index creation failed: {status} {details}"
                      )


          def lambda_handler(event, context):
              ensure_index()
              count = 0

              for record in event.get("Records", []):
                  if record.get("eventSource") != "aws:s3":
                      continue

                  bucket = record["s3"]["bucket"]["name"]
                  key = unquote_plus(record["s3"]["object"]["key"])

                  metadata = s3.head_object(Bucket=bucket, Key=key)
                  custom = metadata.get("Metadata", {}).get(
                      "customlabels", ""
                  ).split(",")

                  detected = rekognition.detect_labels(
                      Image={"S3Object": {"Bucket": bucket, "Name": key}},
                      MaxLabels=100,
                      MinConfidence=80
                  )

                  labels = custom + [
                      label["Name"] for label in detected["Labels"]
                  ]
                  labels = list(dict.fromkeys(
                      label.strip().lower()
                      for label in labels
                      if label.strip()
                  ))

                  document = {
                      "objectKey": key,
                      "bucket": bucket,
                      "createdTimestamp": metadata["LastModified"].isoformat(),
                      "labels": labels
                  }

                  document_id = hashlib.sha256(
                      f"{bucket}/{key}".encode()
                  ).hexdigest()

                  path = f"/photos/_doc/{document_id}"

                  status, result = es_request(
                      "PUT",
                      path + "?refresh=wait_for",
                      document
                  )

                  if status not in (200, 201):
                      raise RuntimeError(f"Indexing failed: {status} {result}")

                  print("INDEXED_PHOTO:", json.dumps(result))

                  status, stored = es_request("GET", path)

                  if status != 200:
                      raise RuntimeError(f"Read-back failed: {status} {stored}")

                  print("STORED_PHOTO:", json.dumps(stored["_source"]))
                  count += 1

              return {"indexed": count}
      Environment:
        Variables:
          ES_ENDPOINT:
            Ref: ElasticsearchEndpoint
  SearchPhotos:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.lambda_handler
      Role:
        Fn::GetAtt:
        - SearchRole
        - Arn
      Timeout: 30
      MemorySize: 256
      Architectures:
      - x86_64
      Code:
        ZipFile: |-
          # CloudFormation code update demonstration: version 2
          import json
          import logging
          import os
          import uuid
          from urllib.parse import urlparse

          import boto3
          from elasticsearch import Elasticsearch, RequestsHttpConnection
          from requests_aws4auth import AWS4Auth

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          session = boto3.Session()
          region = session.region_name or "us-east-1"
          lex = session.client("lexv2-runtime")
          s3 = session.client("s3")

          endpoint = urlparse(os.environ["ES_ENDPOINT"])
          auth = AWS4Auth(
              region=region,
              service="es",
              refreshable_credentials=session.get_credentials(),
          )

          es = Elasticsearch(
              hosts=[{"host": endpoint.hostname, "port": 443}],
              http_auth=auth,
              use_ssl=True,
              verify_certs=True,
              connection_class=RequestsHttpConnection,
              timeout=10,
              max_retries=1,
              retry_on_timeout=True,
          )


          def respond(status, body):
              return {
                  "statusCode": status,
                  "headers": {
                      "Content-Type": "application/json",
                      "Access-Control-Allow-Origin": "*",
                  },
                  "body": json.dumps(body),
              }


          def extract_keywords(query):
              response = lex.recognize_text(
                  botId=os.environ["LEX_BOT_ID"],
                  botAliasId=os.environ["LEX_ALIAS_ID"],
                  localeId="en_US",
                  sessionId=str(uuid.uuid4()),
                  text=query,
              )

              intent = response.get("sessionState", {}).get("intent", {})
              if intent.get("name") != "SearchIntent":
                  return []

              slots = intent.get("slots") or {}
              keywords = []

              for name in ("KeywordOne", "KeywordTwo"):
                  slot = slots.get(name) or {}
                  value = slot.get("value") or {}
                  keyword = (
                      value.get("originalValue")
                      or value.get("interpretedValue")
                      or ""
                  ).strip().lower()

                  if keyword and keyword not in keywords:
                      keywords.append(keyword)

              logger.info("SEARCH_KEYWORDS: %s", json.dumps(keywords))
              return keywords


          def search_photos(keywords):
              clauses = []
              for keyword in keywords:
                  clauses.extend([
                      {"term": {"labels.raw": keyword}},
                      {"match_phrase": {"labels": keyword}},
                  ])

              body = {
                  "query": {
                      "bool": {
                          "filter": [
                              {"term": {"bucket": os.environ["PHOTO_BUCKET"]}}
                          ],
                          "should": clauses,
                          "minimum_should_match": 1,
                      }
                  }
              }

              results = []
              seen = set()
              scroll_id = None

              try:
                  page = es.search(
                      index="photos",
                      body=body,
                      size=100,
                      scroll="1m",
                  )

                  while True:
                      scroll_id = page.get("_scroll_id") or scroll_id
                      hits = page.get("hits", {}).get("hits", [])
                      if not hits:
                          break

                      for hit in hits:
                          photo = hit["_source"]
                          bucket = photo["bucket"]
                          key = photo["objectKey"]

                          if bucket != os.environ["PHOTO_BUCKET"]:
                              continue
                          if (bucket, key) in seen:
                              continue

                          seen.add((bucket, key))
                          url = s3.generate_presigned_url(
                              "get_object",
                              Params={"Bucket": bucket, "Key": key},
                              ExpiresIn=3600,
                          )
                          results.append({
                              "url": url,
                              "labels": photo.get("labels", []),
                          })

                      if not scroll_id:
                          break

                      page = es.scroll(scroll_id=scroll_id, scroll="1m")
              finally:
                  if scroll_id:
                      try:
                          es.clear_scroll(scroll_id=scroll_id)
                      except Exception:
                          logger.warning("Could not clear search scroll", exc_info=True)

              return results


          def lambda_handler(event, context):
              params = event.get("queryStringParameters") or {}
              query = (params.get("q") or "").strip()

              if not query:
                  return respond(200, {"results": []})

              if len(query) > 1000:
                  return respond(400, {"message": "Search query is too long"})

              try:
                  keywords = extract_keywords(query)
                  if not keywords:
                      return respond(200, {"results": []})

                  results = search_photos(keywords)
                  logger.info("SEARCH_RESULT_COUNT: %s", len(results))
                  return respond(200, {"results": results})
              except Exception:
                  logger.exception("Photo search failed")
                  return respond(500, {"message": "Photo search failed"})
      Environment:
        Variables:
          ES_ENDPOINT:
            Ref: ElasticsearchEndpoint
          LEX_BOT_ID:
            Ref: LexBotId
          LEX_ALIAS_ID:
            Ref: LexAliasId
          PHOTO_BUCKET:
            Fn::Sub: ${ResourcePrefix}-${AWS::AccountId}-${AWS::Region}-photos
      Layers:
      - Ref: SearchDependenciesLayerArn
  S3InvokeIndexPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName:
        Ref: IndexPhotos
      Principal: s3.amazonaws.com
      SourceAccount:
        Ref: AWS::AccountId
      SourceArn:
        Fn::Sub: arn:${AWS::Partition}:s3:::${ResourcePrefix}-${AWS::AccountId}-${AWS::Region}-photos
  PhotoBucket:
    Type: AWS::S3::Bucket
    DependsOn: S3InvokeIndexPermission
    Properties:
      BucketName:
        Fn::Sub: ${ResourcePrefix}-${AWS::AccountId}-${AWS::Region}-photos
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      NotificationConfiguration:
        LambdaConfigurations:
        - Event: s3:ObjectCreated:Put
          Function:
            Fn::GetAtt:
            - IndexPhotos
            - Arn
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      WebsiteConfiguration:
        IndexDocument: index.html
      OwnershipControls:
        Rules:
        - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false
  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket:
        Ref: FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Sid: PublicReadFrontend
          Effect: Allow
          Principal: '*'
          Action: s3:GetObject
          Resource:
            Fn::Sub: ${FrontendBucket.Arn}/*
  ApiS3Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: apigateway.amazonaws.com
          Action: sts:AssumeRole
      Policies:
      - PolicyName: PhotoAlbumPermissions
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action: s3:PutObject
            Resource:
              Fn::Sub: arn:${AWS::Partition}:s3:::${ResourcePrefix}-${AWS::AccountId}-${AWS::Region}-photos/*
  PhotoApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name:
        Fn::Sub: ${AWS::StackName}-photo-api
      EndpointConfiguration:
        Types:
        - REGIONAL
      BinaryMediaTypes:
      - image/jpeg
      - image/png
      - application/octet-stream
      ApiKeySourceType: HEADER
  PhotosResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId:
        Ref: PhotoApi
      ParentId:
        Fn::GetAtt:
        - PhotoApi
        - RootResourceId
      PathPart: photos
  SearchResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId:
        Ref: PhotoApi
      ParentId:
        Fn::GetAtt:
        - PhotoApi
        - RootResourceId
      PathPart: search
  PhotosOptions:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId:
        Ref: PhotoApi
      ResourceId:
        Ref: PhotosResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      ApiKeyRequired: false
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode":200}'
        IntegrationResponses:
        - StatusCode: '200'
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: '''*'''
            method.response.header.Access-Control-Allow-Methods: '''GET,PUT,OPTIONS'''
            method.response.header.Access-Control-Allow-Headers: '''Content-Type,X-Api-Key,x-amz-meta-customLabels'''
      MethodResponses:
      - StatusCode: '200'
        ResponseParameters:
          method.response.header.Access-Control-Allow-Origin: false
          method.response.header.Access-Control-Allow-Methods: false
          method.response.header.Access-Control-Allow-Headers: false
  SearchOptions:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId:
        Ref: PhotoApi
      ResourceId:
        Ref: SearchResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      ApiKeyRequired: false
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode":200}'
        IntegrationResponses:
        - StatusCode: '200'
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: '''*'''
            method.response.header.Access-Control-Allow-Methods: '''GET,PUT,OPTIONS'''
            method.response.header.Access-Control-Allow-Headers: '''Content-Type,X-Api-Key,x-amz-meta-customLabels'''
      MethodResponses:
      - StatusCode: '200'
        ResponseParameters:
          method.response.header.Access-Control-Allow-Origin: false
          method.response.header.Access-Control-Allow-Methods: false
          method.response.header.Access-Control-Allow-Headers: false
  PhotosPut:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId:
        Ref: PhotoApi
      ResourceId:
        Ref: PhotosResource
      HttpMethod: PUT
      AuthorizationType: NONE
      ApiKeyRequired: true
      RequestParameters:
        method.request.querystring.filename: true
        method.request.header.Content-Type: true
        method.request.header.x-amz-meta-customLabels: false
      Integration:
        Type: AWS
        IntegrationHttpMethod: PUT
        Credentials:
          Fn::GetAtt:
          - ApiS3Role
          - Arn
        Uri:
          Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}:s3:path/${ResourcePrefix}-${AWS::AccountId}-${AWS::Region}-photos/{filename}
        PassthroughBehavior: WHEN_NO_MATCH
        RequestParameters:
          integration.request.path.filename: method.request.querystring.filename
          integration.request.header.Content-Type: method.request.header.Content-Type
          integration.request.header.x-amz-meta-customLabels: method.request.header.x-amz-meta-customLabels
        IntegrationResponses:
        - StatusCode: '200'
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: '''*'''
        - StatusCode: '400'
          SelectionPattern: 4\d{2}
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: '''*'''
        - StatusCode: '500'
          SelectionPattern: 5\d{2}
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: '''*'''
      MethodResponses:
      - StatusCode: '200'
        ResponseParameters:
          method.response.header.Access-Control-Allow-Origin: false
      - StatusCode: '400'
        ResponseParameters:
          method.response.header.Access-Control-Allow-Origin: false
      - StatusCode: '500'
        ResponseParameters:
          method.response.header.Access-Control-Allow-Origin: false
  SearchGet:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId:
        Ref: PhotoApi
      ResourceId:
        Ref: SearchResource
      HttpMethod: GET
      AuthorizationType: NONE
      ApiKeyRequired: true
      RequestParameters:
        method.request.querystring.q: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SearchPhotos.Arn}/invocations
  ApiInvokeSearchPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName:
        Ref: SearchPhotos
      Principal: apigateway.amazonaws.com
      SourceArn:
        Fn::Sub: arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${PhotoApi}/*/GET/search
  ApiDeploymentV1:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
    - PhotosPut
    - SearchGet
    - PhotosOptions
    - SearchOptions
    Properties:
      RestApiId:
        Ref: PhotoApi
  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId:
        Ref: PhotoApi
      DeploymentId:
        Ref: ApiDeploymentV1
      StageName: test
  ApiKey:
    Type: AWS::ApiGateway::ApiKey
    Properties:
      Enabled: true
  UsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    Properties:
      ApiStages:
      - ApiId:
          Ref: PhotoApi
        Stage:
          Ref: ApiStage
      Throttle:
        BurstLimit: 10
        RateLimit: 5
  UsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId:
        Ref: ApiKey
      KeyType: API_KEY
      UsagePlanId:
        Ref: UsagePlan
  Default4xxCors:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId:
        Ref: PhotoApi
      ResponseType: DEFAULT_4XX
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: '''*'''
  Default5xxCors:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId:
        Ref: PhotoApi
      ResponseType: DEFAULT_5XX
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: '''*'''
Outputs:
  FrontendWebsiteURL:
    Description: Public frontend website URL; upload index.html and assets after stack creation.
    Value:
      Fn::GetAtt:
      - FrontendBucket
      - WebsiteURL
  FrontendBucketName:
    Value:
      Ref: FrontendBucket
  PhotoBucketName:
    Value:
      Ref: PhotoBucket
  IndexLambdaName:
    Value:
      Ref: IndexPhotos
  SearchLambdaName:
    Value:
      Ref: SearchPhotos
  ApiBaseURL:
    Value:
      Fn::Sub: https://${PhotoApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/test
  ApiKeyId:
    Description: Key ID only. Retrieve its value in API Gateway console; it is not your existing app key.
    Value:
      Ref: ApiKey
  RestApiId:
    Value:
      Ref: PhotoApi
