<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Photo Album</title><link rel="stylesheet" href="styles.css"></head>
<body><main><header><p class="eyebrow">CLOUD PHOTO ALBUM</p><h1>Your photos, found in words.</h1><p>Search for objects, scenes, or your own custom labels. Discover your photos, one search at a time.</p></header>
<div class="panels"><section><h2>Find a photo</h2><form id="search-form"><label for="query">What are you looking for?</label><input id="query" required placeholder="Show me cats and dogs"><button id="search-button">Search photos</button></form><p id="search-status" role="status">Your search results will appear below.</p></section>
<section><h2>Add a memory</h2><form id="upload-form"><label for="photo">Photo · JPEG or PNG, up to 7 MB</label><input id="photo" type="file" accept="image/jpeg,image/png" required><label for="labels">Custom labels (optional)</label><input id="labels" placeholder="Sam, Sally, vacation"><button id="upload-button">Upload photo</button></form><p id="upload-status" role="status"></p></section></div>
<section aria-label="Photo search results"><div id="results" class="gallery"></div></section></main>
<script src="sdk/lib/axios/dist/axios.standalone.js"></script>
<script src="sdk/lib/CryptoJS/rollups/crypto-js.js"></script>
<script src="sdk/lib/CryptoJS/rollups/sha256.js"></script>
<script src="sdk/lib/CryptoJS/components/hmac.js"></script>
<script src="sdk/lib/CryptoJS/components/enc-base64.js"></script>
<script src="sdk/lib/url-template/url-template.js"></script>
<script src="sdk/lib/apiGatewayCore/sigV4Client.js"></script>
<script src="sdk/lib/apiGatewayCore/apiGatewayClient.js"></script>
<script src="sdk/lib/apiGatewayCore/simpleHttpClient.js"></script>
<script src="sdk/lib/apiGatewayCore/utils.js"></script>
<script src="sdk/apigClient.js"></script><script src="app.js"></script></body></html>
